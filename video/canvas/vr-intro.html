<!doctype html>
<!--
  VR showcase intro (video/VR_VIDEO_SCRIPT.md § 4): generic unbranded headset → dive into the lens → highland
  landscape, a laser picks a car, the car turns into a spinning 3D model → an unbranded laptop opens and the
  camera flies into its screen (the first frame of the app capture). Everything is procedural Three.js: no
  photo, no logo. Seekable: window.__seek(ms) renders that instant (video/scripts/render-canvas.cjs).
  Query: ?three=<file URL of the three package dir>&screen=<image URL for the laptop screen>
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VR intro</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
      }
      canvas {
        display: block;
      }
      #iris {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: #000;
        -webkit-mask-image: radial-gradient(
          circle at 50% 50%,
          transparent var(--r, 0%),
          #000 calc(var(--r, 0%) + 6%)
        );
        mask-image: radial-gradient(
          circle at 50% 50%,
          transparent var(--r, 0%),
          #000 calc(var(--r, 0%) + 6%)
        );
        opacity: 0;
      }
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, #bff6ff 45%, #4dd8e8 100%);
        opacity: 0;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
      }
      #title {
        position: fixed;
        left: 0;
        right: 0;
        top: 9%;
        text-align: center;
        color: var(--text);
        opacity: 0;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
      }
      #title h1 {
        margin: 0;
        font-family: 'Grotesk', 'Inter', sans-serif;
        font-size: 4.6vw;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      #title h1 span {
        color: var(--cyan);
      }
      #title p {
        margin: 0.6vw 0 0;
        font-family: 'Mono', monospace;
        font-size: 1.15vw;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body data-duration="38000">
    <div id="vignette"></div>
    <div id="iris"></div>
    <div id="flash"></div>
    <div id="title">
      <h1>Mitsinjo Grid <span>VR</span></h1>
      <p>Solar village twin · WebXR</p>
    </div>
    <script>
      // Import map from the query: the examples import the bare specifier "three".
      const q = new URLSearchParams(location.search);
      const base = (q.get('three') || '../../apps/web/node_modules/three').replace(/\/$/, '');
      document.write(
        '<script type="importmap">' +
          JSON.stringify({
            imports: {
              three: base + '/build/three.module.js',
              'three/addons/': base + '/examples/jsm/',
            },
          }) +
          '<\/script>'
      );
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

      // ---------- helpers ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eout = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, x) => a + (b - a) * x;
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const C = {
        cyan: 0x4dd8e8,
        amber: 0xffb547,
        violet: 0xb6a0ff,
        green: 0x53d6a0,
      };

      const W = innerWidth;
      const H = innerHeight;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.prepend(renderer.domElement);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new THREE.PerspectiveCamera(35, W / H, 0.005, 2000);
      const composer = new EffectComposer(renderer);
      const renderPass = new RenderPass(new THREE.Scene(), camera);
      const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.6, 0.85);
      composer.addPass(renderPass);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      const glow = (color, opacity = 1) =>
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
      function textSprite(text, color, scale) {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 160;
        const g = c.getContext('2d');
        g.fillStyle = 'rgba(8,13,26,0.82)';
        g.strokeStyle = color;
        g.lineWidth = 6;
        g.beginPath();
        g.roundRect(6, 6, 1012, 148, 30);
        g.fill();
        g.stroke();
        g.fillStyle = color;
        g.font = '600 64px Inter, sans-serif';
        g.textBaseline = 'middle';
        g.fillText(text, 48, 82);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const s = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false })
        );
        s.scale.set(scale * 6.4, scale, 1);
        s.renderOrder = 10;
        return s;
      }

      // =====================================================================
      // Scene A — the headset in a dark void
      // =====================================================================
      const sA = new THREE.Scene();
      sA.background = new THREE.Color(0x05080f);
      sA.environment = envTex;
      sA.fog = new THREE.FogExp2(0x05080f, 0.9);
      const headset = new THREE.Group();
      sA.add(headset);
      const shell = new THREE.MeshPhysicalMaterial({
        color: 0xe4e7ec,
        roughness: 0.42,
        clearcoat: 0.6,
        clearcoatRoughness: 0.3,
      });
      const blackGloss = new THREE.MeshPhysicalMaterial({
        color: 0x0a0d14,
        roughness: 0.12,
        metalness: 0.2,
        clearcoat: 1,
        clearcoatRoughness: 0.05,
      });
      const fabric = new THREE.MeshStandardMaterial({ color: 0x23272f, roughness: 0.95 });
      const strapMat = new THREE.MeshStandardMaterial({ color: 0x3a3f49, roughness: 0.7 });
      const body = new THREE.Mesh(new RoundedBoxGeometry(0.19, 0.105, 0.07, 8, 0.03), shell);
      headset.add(body);
      const front = new THREE.Mesh(
        new RoundedBoxGeometry(0.176, 0.092, 0.012, 8, 0.006),
        blackGloss
      );
      front.position.z = 0.031;
      headset.add(front);
      // Four tracking sensors + a thin status light (no mark, no logo).
      const sensorMat = new THREE.MeshPhysicalMaterial({
        color: 0x15181f,
        roughness: 0.05,
        clearcoat: 1,
      });
      for (const [x, y] of [
        [-0.07, 0.03],
        [0.07, 0.03],
        [-0.07, -0.03],
        [0.07, -0.03],
      ]) {
        const s = new THREE.Mesh(new THREE.CircleGeometry(0.0065, 24), sensorMat);
        s.position.set(x, y, 0.0375);
        headset.add(s);
      }
      const ledMat = glow(C.cyan, 0.9);
      const led = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.0025), ledMat);
      led.position.set(0, -0.038, 0.0377);
      headset.add(led);
      const face = new THREE.Mesh(new RoundedBoxGeometry(0.172, 0.094, 0.04, 6, 0.018), fabric);
      face.position.z = -0.05;
      headset.add(face);
      const lensMat = new THREE.MeshPhysicalMaterial({
        color: 0x0b1626,
        roughness: 0.02,
        metalness: 0.1,
        clearcoat: 1,
        emissive: new THREE.Color(C.cyan),
        emissiveIntensity: 0.15,
      });
      const lenses = [];
      for (const x of [-0.032, 0.032]) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.021, 0.0035, 16, 48), blackGloss);
        ring.position.set(x, 0.002, -0.0705);
        headset.add(ring);
        const lens = new THREE.Mesh(new THREE.CircleGeometry(0.021, 48), lensMat);
        lens.rotation.y = Math.PI;
        lens.position.set(x, 0.002, -0.0702);
        headset.add(lens);
        lenses.push(lens);
      }
      // Head strap: an open loop behind, plus two side arms.
      const strap = new THREE.Mesh(
        new THREE.TorusGeometry(0.098, 0.006, 14, 64, Math.PI),
        strapMat
      );
      strap.rotation.x = -Math.PI / 2;
      strap.scale.set(1, 1.7, 1);
      strap.position.set(0, 0, -0.045);
      headset.add(strap);
      for (const x of [-0.098, 0.098]) {
        const arm = new THREE.Mesh(new RoundedBoxGeometry(0.014, 0.022, 0.07, 4, 0.006), shell);
        arm.position.set(x, 0, -0.045);
        headset.add(arm);
      }
      const keyA = new THREE.DirectionalLight(0xffc27a, 3.2);
      keyA.position.set(-1.2, 0.6, 0.6);
      sA.add(keyA);
      const rimA = new THREE.DirectionalLight(C.cyan, 4.0);
      rimA.position.set(1.0, 0.3, -0.8);
      sA.add(rimA);
      sA.add(new THREE.AmbientLight(0x4060a0, 0.25));
      // Floating dust.
      const dustGeo = new THREE.BufferGeometry();
      const dp = [];
      for (let i = 0; i < 700; i++)
        dp.push((rnd() - 0.5) * 1.6, (rnd() - 0.5) * 0.9, (rnd() - 0.5) * 1.6);
      dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
      const dust = new THREE.Points(
        dustGeo,
        new THREE.PointsMaterial({
          color: 0xffd9a0,
          size: 0.0035,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      sA.add(dust);

      // =====================================================================
      // Scene L — highland landscape with the car
      // =====================================================================
      const sL = new THREE.Scene();
      sL.environment = envTex;
      sL.fog = new THREE.Fog(0xd8e4ee, 140, 760);
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(900, 32, 16),
        new THREE.ShaderMaterial({
          side: THREE.BackSide,
          depthWrite: false,
          uniforms: {},
          vertexShader:
            'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
          fragmentShader:
            'varying vec3 vP; void main(){ float h = clamp(vP.y,0.,1.); vec3 z = vec3(0.23,0.47,0.82); vec3 hz = vec3(0.98,0.86,0.66); vec3 c = mix(hz, z, pow(h,0.55)); float s = pow(max(dot(vP, normalize(vec3(-0.5,0.32,-0.8))),0.),180.); c += vec3(1.,0.85,0.6)*s*1.4; gl_FragColor = vec4(c,1.); }',
        })
      );
      sL.add(sky);
      const sun = new THREE.DirectionalLight(0xfff0d8, 3.0);
      sun.position.set(-40, 30, -50);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -15,
        right: 15,
        top: 15,
        bottom: -15,
        near: 1,
        far: 150,
      });
      sL.add(sun);
      sL.add(new THREE.HemisphereLight(0xbfdcff, 0x5a4a2a, 0.55));

      // Value noise for the hills.
      const hash = (x, y) => {
        const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      const noise = (x, y) => {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;
        const u = xf * xf * (3 - 2 * xf);
        const v = yf * yf * (3 - 2 * yf);
        return lerp(
          lerp(hash(xi, yi), hash(xi + 1, yi), u),
          lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u),
          v
        );
      };
      const fbm = (x, y) =>
        noise(x, y) * 0.6 + noise(x * 2.1, y * 2.1) * 0.27 + noise(x * 4.3, y * 4.3) * 0.13;
      // The road: a gentle curve through the origin.
      const roadX = (z) => Math.sin(z * 0.035) * 6 - Math.sin(0) * 6;
      const height = (x, z) => {
        const d = Math.hypot(x, z);
        const flat = clamp((d - 14) / 40);
        let h = (fbm(x * 0.012 + 3, z * 0.012 + 9) - 0.35) * 70 * flat;
        // Terraced rice fields on the left hill.
        const tx = x + 55;
        const tz = z + 70;
        const td = Math.hypot(tx, tz);
        if (td < 60) {
          const k = 1 - td / 60;
          const hh = h + k * 18;
          h = lerp(h, Math.floor(hh / 1.6) * 1.6, clamp(k * 3));
        }
        return h - 0.02;
      };
      const groundGeo = new THREE.PlaneGeometry(900, 900, 260, 260);
      groundGeo.rotateX(-Math.PI / 2);
      const gp = groundGeo.attributes.position;
      const colors = [];
      const col = new THREE.Color();
      for (let i = 0; i < gp.count; i++) {
        const x = gp.getX(i);
        const z = gp.getZ(i);
        let h = height(x, z);
        const rd = Math.abs(x - roadX(z));
        const road = clamp(1 - (rd - 2.2) / 1.2);
        h = lerp(h, 0, clamp(1 - (rd - 3) / 10));
        gp.setY(i, h);
        const n = fbm(x * 0.08, z * 0.08);
        const terr = Math.hypot(x + 55, z + 70) < 60;
        if (terr) col.setHSL(0.24 + n * 0.05, 0.55, 0.32 + (Math.floor((h + 50) / 1.6) % 2) * 0.06);
        else col.setHSL(0.25 + n * 0.06, 0.62, 0.2 + n * 0.1);
        const laterite = new THREE.Color(0xa4472a).lerp(new THREE.Color(0xc76a3c), n);
        col.lerp(laterite, road);
        colors.push(col.r, col.g, col.b);
      }
      groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      groundGeo.computeVertexNormals();
      const ground = new THREE.Mesh(
        groundGeo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })
      );
      ground.receiveShadow = true;
      sL.add(ground);

      // Houses (red brick, tin or thatch roofs) and trees.
      const brick = new THREE.MeshStandardMaterial({ color: 0xb5523b, roughness: 0.9 });
      const tin = new THREE.MeshStandardMaterial({
        color: 0x8b949e,
        roughness: 0.45,
        metalness: 0.6,
      });
      const thatch = new THREE.MeshStandardMaterial({ color: 0xa88a52, roughness: 1 });
      const houses = [];
      function house(x, z, rot, roofMat, s = 1) {
        const g = new THREE.Group();
        const w = new THREE.Mesh(new THREE.BoxGeometry(4 * s, 2.6 * s, 3 * s), brick);
        w.position.y = 1.3 * s;
        const r = new THREE.Mesh(new THREE.ConeGeometry(3.2 * s, 1.8 * s, 4), roofMat);
        r.rotation.y = Math.PI / 4;
        r.scale.set(1.05, 1, 0.8);
        r.position.y = 2.6 * s + 0.9 * s;
        const d = new THREE.Mesh(
          new THREE.BoxGeometry(0.8 * s, 1.5 * s, 0.05),
          new THREE.MeshStandardMaterial({ color: 0x4a2f1f })
        );
        d.position.set(0, 0.75 * s, 1.52 * s);
        g.add(w, r, d);
        g.traverse((m) => m.isMesh && ((m.castShadow = true), (m.receiveShadow = true)));
        g.position.set(x, height(x, z), z);
        g.rotation.y = rot;
        sL.add(g);
        houses.push(g);
        return g;
      }
      house(-11, -8, 0.4, tin);
      house(-17, -16, 0.2, thatch, 0.9);
      house(12, -22, -0.5, tin, 1.1);
      house(22, -40, -0.3, thatch);
      house(-30, -38, 0.6, tin);
      const leaf = new THREE.MeshStandardMaterial({ color: 0x2f6b32, roughness: 0.9 });
      const trunk = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 1 });
      const trees = [];
      for (let i = 0; i < 70; i++) {
        const a = rnd() * Math.PI * 2;
        const r = 12 + rnd() * 90;
        const x = Math.cos(a) * r;
        const z = Math.sin(a) * r - 20;
        if (Math.abs(x - roadX(z)) < 5 || z > 8) continue;
        const g = new THREE.Group();
        const s = 0.8 + rnd() * 0.9;
        const tr = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12 * s, 0.18 * s, 2.2 * s, 6),
          trunk
        );
        tr.position.y = 1.1 * s;
        const cr = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4 * s, 1), leaf);
        cr.position.y = 2.8 * s;
        cr.scale.y = 0.85;
        g.add(tr, cr);
        g.traverse((m) => m.isMesh && (m.castShadow = true));
        g.position.set(x, height(x, z), z);
        sL.add(g);
        trees.push(g);
      }

      // The car: a generic compact, built from an extruded side profile (no grille, no badge).
      const car = new THREE.Group();
      const carParts = [];
      const paint = new THREE.MeshPhysicalMaterial({
        color: 0x5f86b0,
        roughness: 0.35,
        metalness: 0.5,
        clearcoat: 1,
        clearcoatRoughness: 0.12,
        transparent: true,
      });
      const glass = new THREE.MeshPhysicalMaterial({
        color: 0x0d1520,
        roughness: 0.05,
        metalness: 0.3,
        clearcoat: 1,
        transparent: true,
      });
      const rubber = new THREE.MeshStandardMaterial({
        color: 0x15171a,
        roughness: 0.85,
        transparent: true,
      });
      const chrome = new THREE.MeshStandardMaterial({
        color: 0xc9cfd6,
        roughness: 0.25,
        metalness: 1,
        transparent: true,
      });
      const prof = new THREE.Shape();
      prof.moveTo(-2.05, 0.32);
      prof.lineTo(2.0, 0.32);
      prof.quadraticCurveTo(2.12, 0.35, 2.1, 0.62);
      prof.quadraticCurveTo(2.05, 0.82, 1.55, 0.86);
      prof.lineTo(0.9, 0.9);
      prof.lineTo(-1.6, 0.92);
      prof.quadraticCurveTo(-2.05, 0.9, -2.08, 0.62);
      prof.lineTo(-2.05, 0.32);
      const bodyGeo = new THREE.ExtrudeGeometry(prof, {
        depth: 1.62,
        bevelEnabled: true,
        bevelSize: 0.06,
        bevelThickness: 0.08,
        bevelSegments: 4,
      });
      bodyGeo.translate(0, 0, -0.81);
      const carBody = new THREE.Mesh(bodyGeo, paint);
      const cab = new THREE.Shape();
      cab.moveTo(0.95, 0.88);
      cab.quadraticCurveTo(0.55, 1.3, 0.2, 1.36);
      cab.lineTo(-1.15, 1.36);
      cab.quadraticCurveTo(-1.55, 1.3, -1.72, 0.9);
      cab.lineTo(0.95, 0.88);
      const cabGeo = new THREE.ExtrudeGeometry(cab, {
        depth: 1.42,
        bevelEnabled: true,
        bevelSize: 0.05,
        bevelThickness: 0.06,
        bevelSegments: 3,
      });
      cabGeo.translate(0, 0, -0.71);
      const cabin = new THREE.Mesh(cabGeo, glass);
      const roof = new THREE.Mesh(new RoundedBoxGeometry(1.25, 0.06, 1.46, 3, 0.03), paint);
      roof.position.set(-0.47, 1.4, 0);
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.48, 1.5), paint);
      pillar.position.set(-0.45, 1.12, 0);
      car.add(carBody, cabin, roof, pillar);
      carParts.push(carBody, cabin, roof, pillar);
      for (const [x, z] of [
        [1.35, 0.8],
        [1.35, -0.8],
        [-1.32, 0.8],
        [-1.32, -0.8],
      ]) {
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 28), rubber);
        tire.rotation.x = Math.PI / 2;
        tire.position.set(x, 0.34, z);
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.25, 20), chrome);
        rim.rotation.x = Math.PI / 2;
        rim.position.copy(tire.position);
        car.add(tire, rim);
        carParts.push(tire, rim);
      }
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xfff4d6, transparent: true });
      for (const z of [0.55, -0.55]) {
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.32), lightMat);
        l.position.set(2.14, 0.66, z);
        const r = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.1, 0.3),
          new THREE.MeshBasicMaterial({ color: 0xc23a2a, transparent: true })
        );
        r.position.set(-2.12, 0.7, z);
        car.add(l, r);
        carParts.push(l, r);
      }
      car.traverse((m) => m.isMesh && (m.castShadow = true));
      car.rotation.y = 1.45;
      car.position.set(roadX(0), 0, 0);
      sL.add(car);
      // Edge outline (traced by drawRange) and wireframe twin.
      const outline = new THREE.Group();
      const wire = new THREE.Group();
      for (const m of carParts) {
        const eg = new THREE.EdgesGeometry(m.geometry, 28);
        const l = new THREE.LineSegments(
          eg,
          new THREE.LineBasicMaterial({
            color: C.cyan,
            transparent: true,
            opacity: 0,
            depthTest: false,
          })
        );
        l.position.copy(m.position);
        l.rotation.copy(m.rotation);
        l.renderOrder = 5;
        outline.add(l);
        const w = new THREE.LineSegments(
          new THREE.WireframeGeometry(m.geometry),
          new THREE.LineBasicMaterial({
            color: C.cyan,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          })
        );
        w.position.copy(m.position);
        w.rotation.copy(m.rotation);
        wire.add(w);
      }
      car.add(outline, wire);
      const label = textSprite('car  ·  AI perception', '#b6a0ff', 0.55);
      label.position.set(0, 2.25, 0);
      car.add(label);
      // Scan ring and hologram pedestal.
      const scanRing = new THREE.Mesh(new THREE.TorusGeometry(1, 0.025, 8, 96), glow(C.cyan, 0));
      scanRing.rotation.x = Math.PI / 2;
      scanRing.scale.set(2.5, 1.3, 1);
      scanRing.position.copy(car.position);
      sL.add(scanRing);
      const pedestal = new THREE.Group();
      const ped1 = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.32, 96), glow(C.cyan, 0));
      ped1.rotation.x = -Math.PI / 2;
      const ped2 = new THREE.Mesh(new THREE.RingGeometry(2.55, 2.58, 96), glow(C.cyan, 0));
      ped2.rotation.x = -Math.PI / 2;
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(2.25, 2.25, 2.4, 64, 1, true),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          uniforms: { o: { value: 0 } },
          vertexShader:
            'varying float vy; void main(){ vy = position.y/2.4+0.5; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
          fragmentShader:
            'uniform float o; varying float vy; void main(){ gl_FragColor = vec4(0.3,0.85,0.91, (1.-vy)*0.35*o); }',
        })
      );
      beam.position.y = 1.2;
      pedestal.add(ped1, ped2, beam);
      pedestal.position.set(car.position.x, 0.04, 0);
      sL.add(pedestal);
      // Laser from the viewer's right hand.
      const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 8), glow(C.cyan, 0));
      sL.add(laser);
      const laserDot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), glow(0xffffff, 0));
      sL.add(laserDot);
      // Other objects that light up: one outline box each.
      const pulses = [houses[0], houses[2], trees[3], houses[1]].map((o) => {
        const box = new THREE.Box3().setFromObject(o);
        const size = box.getSize(v3());
        const c = box.getCenter(v3());
        const l = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z)),
          new THREE.LineBasicMaterial({
            color: C.cyan,
            transparent: true,
            opacity: 0,
            depthTest: false,
          })
        );
        l.position.copy(c);
        sL.add(l);
        return l;
      });

      // =====================================================================
      // Scene D — the unbranded laptop on a wooden desk
      // =====================================================================
      const sD = new THREE.Scene();
      sD.background = new THREE.Color(0x0a0c12);
      sD.environment = envTex;
      const woodC = document.createElement('canvas');
      woodC.width = 1024;
      woodC.height = 1024;
      {
        const g = woodC.getContext('2d');
        g.fillStyle = '#6b4428';
        g.fillRect(0, 0, 1024, 1024);
        for (let i = 0; i < 260; i++) {
          g.strokeStyle = `rgba(${40 + rnd() * 40},${22 + rnd() * 20},${10 + rnd() * 10},${0.15 + rnd() * 0.25})`;
          g.lineWidth = 1 + rnd() * 3;
          const y = rnd() * 1024;
          g.beginPath();
          g.moveTo(0, y);
          for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 6);
          g.stroke();
        }
      }
      const woodTex = new THREE.CanvasTexture(woodC);
      woodTex.colorSpace = THREE.SRGBColorSpace;
      woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
      woodTex.repeat.set(2, 2);
      const desk = new THREE.Mesh(
        new THREE.PlaneGeometry(6, 6),
        new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55 })
      );
      desk.rotation.x = -Math.PI / 2;
      desk.receiveShadow = true;
      sD.add(desk);
      const alu = new THREE.MeshPhysicalMaterial({
        color: 0xb9bec6,
        metalness: 0.9,
        roughness: 0.32,
        clearcoat: 0.3,
      });
      const laptop = new THREE.Group();
      sD.add(laptop);
      const LW = 0.34;
      const LD = 0.235;
      const base = new THREE.Mesh(new RoundedBoxGeometry(LW, 0.014, LD, 5, 0.006), alu);
      base.position.y = 0.007;
      base.castShadow = true;
      laptop.add(base);
      const deck = new THREE.Mesh(
        new THREE.PlaneGeometry(LW - 0.03, 0.12),
        new THREE.MeshStandardMaterial({ color: 0x1a1d23, roughness: 0.7 })
      );
      deck.rotation.x = -Math.PI / 2;
      deck.position.set(0, 0.0142, -0.035);
      laptop.add(deck);
      const keyGeo = new RoundedBoxGeometry(0.0165, 0.003, 0.0165, 2, 0.002);
      const keyMat = new THREE.MeshStandardMaterial({ color: 0x0d0f13, roughness: 0.6 });
      const keys = new THREE.InstancedMesh(keyGeo, keyMat, 14 * 6);
      const mtx = new THREE.Matrix4();
      let ki = 0;
      for (let r = 0; r < 6; r++)
        for (let c = 0; c < 14; c++) {
          mtx.makeTranslation(-0.1365 + c * 0.021, 0.0155, -0.088 + r * 0.0205);
          keys.setMatrixAt(ki++, mtx);
        }
      laptop.add(keys);
      const pad = new THREE.Mesh(
        new THREE.PlaneGeometry(0.11, 0.07),
        new THREE.MeshPhysicalMaterial({ color: 0xa9aeb6, metalness: 0.7, roughness: 0.25 })
      );
      pad.rotation.x = -Math.PI / 2;
      pad.position.set(0, 0.01425, 0.072);
      laptop.add(pad);
      // Lid hinged at the back edge; a plain back panel (no logo).
      const lid = new THREE.Group();
      lid.position.set(0, 0.014, -LD / 2);
      laptop.add(lid);
      const lidShell = new THREE.Mesh(new RoundedBoxGeometry(LW, 0.008, LD, 5, 0.004), alu);
      lidShell.position.set(0, 0.004, LD / 2);
      lidShell.castShadow = true;
      lid.add(lidShell);
      const bezel = new THREE.Mesh(
        new THREE.PlaneGeometry(LW - 0.008, LD - 0.008),
        new THREE.MeshStandardMaterial({ color: 0x050608, roughness: 0.3 })
      );
      bezel.rotation.x = Math.PI / 2;
      bezel.position.set(0, -0.0002, LD / 2);
      lid.add(bezel);
      const SW = 0.3;
      const SH = (SW * 9) / 16;
      const screenMat = new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false });
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), screenMat);
      screen.rotation.x = Math.PI / 2;
      screen.position.set(0, -0.0004, LD / 2 + 0.006);
      lid.add(screen);
      const screenUrl = q.get('screen');
      let screenTex = null;
      const loading = screenUrl
        ? new Promise((res) =>
            new THREE.TextureLoader().load(
              screenUrl,
              (t) => {
                t.colorSpace = THREE.SRGBColorSpace;
                t.anisotropy = 8;
                screenTex = t;
                res();
              },
              undefined,
              res
            )
          )
        : Promise.resolve();
      const keyD = new THREE.SpotLight(0xffd2a0, 30, 6, 0.6, 0.6);
      keyD.position.set(-1.2, 1.6, 1.0);
      keyD.castShadow = true;
      sD.add(keyD);
      const rimD = new THREE.DirectionalLight(C.cyan, 1.4);
      rimD.position.set(1.5, 0.8, -1.5);
      sD.add(rimD);
      sD.add(new THREE.AmbientLight(0x404a60, 0.4));
      const screenLight = new THREE.PointLight(0x8fdcff, 0, 1.2);
      screenLight.position.set(0, 0.15, 0.05);
      sD.add(screenLight);
      // Bokeh in the background.
      for (let i = 0; i < 40; i++) {
        const b = new THREE.Mesh(
          new THREE.CircleGeometry(0.04 + rnd() * 0.08, 32),
          glow(rnd() > 0.5 ? C.amber : C.cyan, 0.08 + rnd() * 0.12)
        );
        b.position.set((rnd() - 0.5) * 5, 0.3 + rnd() * 1.4, -1.6 - rnd() * 1.5);
        sD.add(b);
      }

      // =====================================================================
      // Timeline
      // =====================================================================
      const iris = document.getElementById('iris');
      const flash = document.getElementById('flash');
      const title = document.getElementById('title');
      function render(ms) {
        const t = ms / 1000;
        let scene;
        let flashO = 0;
        let irisO = 0;
        let irisR = 100;
        title.style.opacity = 0;
        if (t < 11) {
          // --- A: headset hero, then dive into the left lens ---
          scene = sA;
          renderer.toneMappingExposure = 1.0;
          headset.rotation.y = lerp(-0.55, 0.25, eio(seg(t, 0, 7))) + Math.sin(t * 0.6) * 0.03;
          headset.rotation.x = Math.sin(t * 0.5) * 0.04;
          headset.position.y = Math.sin(t * 0.9) * 0.004;
          dust.rotation.y = t * 0.02;
          led.material.opacity = 0.6 + Math.sin(t * 3) * 0.3;
          const dive = eio(seg(t, 7, 10.6));
          const turn = eio(seg(t, 6.6, 9));
          headset.rotation.y = lerp(headset.rotation.y, Math.PI, turn);
          const start = v3(0.06, 0.03, 0.55).applyAxisAngle(v3(0, 1, 0), 0.0);
          // Into the lens: once turned, the left lens faces the camera at x = +0.032.
          const lensP = v3(0.032, 0.002, 0.0702);
          const pos = start.clone().lerp(lensP.clone().add(v3(0, 0, 0.01)), dive);
          camera.position.copy(pos);
          camera.lookAt(lerp(0, lensP.x, dive), lerp(0, lensP.y, dive), 0);
          camera.fov = lerp(35, 55, dive);
          lensMat.emissiveIntensity = 0.15 + Math.pow(dive, 3) * 8;
          bloom.strength = 0.5 + dive * 1.5;
          bloom.threshold = 0.85 - dive * 0.6;
          flashO = Math.pow(seg(t, 9.8, 10.9), 2);
        } else if (t < 30.4) {
          // --- L: landscape, the car becomes a 3D model ---
          scene = sL;
          renderer.toneMappingExposure = 0.82;
          camera.fov = 40;
          flashO = 1 - eout(seg(t, 11, 11.8));
          irisO = 1 - seg(t, 12.6, 13);
          irisR = lerp(0, 90, eout(seg(t, 11, 12.8)));
          // Camera: slow drift, a push towards the car, then a rising pull-back.
          const a = eio(seg(t, 11, 20));
          const b = eio(seg(t, 25.5, 30));
          const cp = v3(lerp(14, 8.5, a), lerp(3.2, 2.4, a), lerp(16, 9.5, a));
          cp.lerp(v3(20, 9, 22), b);
          camera.position.copy(cp);
          const look = v3(car.position.x, lerp(1.0, 1.6, eio(seg(t, 22, 25))), 0);
          camera.lookAt(look);
          // Laser.
          const lOn = seg(t, 15.6, 16.4) * (1 - seg(t, 21.4, 22));
          const hand = camera.position.clone().add(v3(1.6, -1.8, -1.2));
          const hit = v3(car.position.x, 0.9, 0.2);
          const dir = hit.clone().sub(hand);
          const len = dir.length() * eout(seg(t, 15.6, 16.6));
          laser.scale.set(1, len, 1);
          laser.position.copy(hand).add(
            dir
              .clone()
              .normalize()
              .multiplyScalar(len / 2)
          );
          laser.quaternion.setFromUnitVectors(v3(0, 1, 0), dir.clone().normalize());
          laser.material.opacity = lOn * 0.9;
          laserDot.position.copy(hit);
          laserDot.material.opacity = lOn * seg(t, 16.4, 16.7) * (0.7 + Math.sin(t * 20) * 0.3);
          // Outline traced, label shown.
          const trace = eout(seg(t, 16.6, 18.2));
          const outO = seg(t, 16.6, 16.9) * (1 - seg(t, 22, 23));
          outline.children.forEach((l) => {
            l.material.opacity = outO;
            l.geometry.setDrawRange(0, Math.floor(l.geometry.attributes.position.count * trace));
          });
          label.material.opacity = seg(t, 18, 18.6) * (1 - seg(t, 23.5, 24.2));
          label.position.y = 2.25 + eout(seg(t, 18, 18.6)) * 0.15;
          // Scan sweep → wireframe → clean model rising and spinning.
          const sweep = seg(t, 20.8, 22.4);
          scanRing.material.opacity = Math.sin(sweep * Math.PI) * 1.0;
          scanRing.position.set(car.position.x, sweep * 1.6, 0);
          const wireO = seg(t, 21, 22.2) * (1 - seg(t, 23.6, 25)) + 0.18 * seg(t, 24, 25);
          wire.children.forEach((w) => (w.material.opacity = wireO));
          const solid = 1 - seg(t, 21.2, 22.4) * (1 - seg(t, 23.4, 24.6));
          for (const m of [paint, glass, rubber, chrome, lightMat]) m.opacity = solid;
          paint.emissive = paint.emissive || new THREE.Color();
          paint.emissive.setHex(C.cyan);
          paint.emissiveIntensity = 0.12 * seg(t, 23.4, 24.6);
          const lift = eio(seg(t, 22.4, 24.6));
          car.position.y = lift * 1.15 + Math.sin(t * 1.6) * 0.04 * lift;
          const spin = Math.max(0, t - 22.6);
          car.rotation.y =
            1.45 +
            spin * spin * 0.08 * (t < 24.6 ? 1 : 0) +
            (t >= 24.6 ? 0.32 + (t - 24.6) * 1.15 : 0);
          const pedO = eout(seg(t, 22.6, 23.6));
          ped1.material.opacity = pedO * 0.9;
          ped2.material.opacity = pedO * (0.5 + Math.sin(t * 4) * 0.2);
          beam.material.uniforms.o.value = pedO;
          pedestal.rotation.y = t * 0.6;
          // Everything could be 3D: other objects flash an outline.
          pulses.forEach((l, i) => {
            const s = 26 + i * 0.75;
            l.material.opacity = Math.sin(seg(t, s, s + 1.2) * Math.PI) * 0.9;
          });
          // Exit: the bloom swells into a flash.
          bloom.strength = 0.08 + Math.pow(seg(t, 29, 30.4), 2) * 3;
          bloom.threshold = 0.97 - seg(t, 29, 30.4) * 0.75;
          flashO = Math.max(flashO, Math.pow(seg(t, 29.6, 30.4), 2));
        } else {
          // --- D: the laptop opens, fly into the screen ---
          scene = sD;
          renderer.toneMappingExposure = 1.0;
          bloom.strength = 0.25;
          bloom.threshold = 0.95;
          flashO = 1 - eout(seg(t, 30.4, 31.2));
          const open = eio(seg(t, 31.2, 33));
          lid.rotation.x = lerp(0, -1.88, open);
          const on = seg(t, 32.4, 33.2);
          screenMat.color.setScalar(on);
          if (screenTex && !screenMat.map) {
            screenMat.map = screenTex;
            screenMat.needsUpdate = true;
          }
          screenLight.intensity = on * 1.2;
          // Screen centre and normal in world space.
          screen.updateWorldMatrix(true, false);
          const sc = screen.getWorldPosition(v3());
          const sn = v3(0, 0, 1)
            .applyQuaternion(screen.getWorldQuaternion(new THREE.Quaternion()))
            .normalize();
          const fov = 40;
          camera.fov = fov;
          const fill = SH / 2 / Math.tan(THREE.MathUtils.degToRad(fov / 2));
          const wide = v3(0.32, 0.36, 0.78);
          const fly = eio(seg(t, 33.6, 37.4));
          const end = sc.clone().add(sn.clone().multiplyScalar(fill));
          camera.position.copy(wide.clone().lerp(end, fly));
          const lookTo = v3(0, 0.1, -0.05).lerp(sc, Math.min(1, fly * 1.4 + open * 0.4));
          camera.up.set(0, 1, 0);
          camera.lookAt(lookTo);
          // Exactly aligned at the end so the screen fills the frame.
          if (fly > 0.999) {
            camera.position.copy(end);
            camera.lookAt(sc);
          }
          const tIn = seg(t, 33.2, 33.9);
          const tOut = 1 - seg(t, 35.8, 36.5);
          title.style.opacity = tIn * tOut;
          title.style.transform = `translateY(${(1 - eout(tIn)) * 24}px)`;
        }
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderPass.scene = scene;
        composer.render();
        flash.style.opacity = flashO;
        iris.style.opacity = irisO;
        iris.style.setProperty('--r', irisR + '%');
      }
      window.__duration = Number(document.body.dataset.duration);
      window.__seek = (ms) => render(ms);
      Promise.all([loading, document.fonts.ready]).then(() => {
        render(0);
        window.__ready = true;
      });
      // Live preview when opened directly (no __seek driver).
      if (q.has('live')) {
        const t0 = performance.now();
        const loop = () => {
          render((performance.now() - t0) % window.__duration);
          requestAnimationFrame(loop);
        };
        loading.then(loop);
      }
    </script>
  </body>
</html>
